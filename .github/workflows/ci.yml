name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  db:
    name: db
    runs-on: ubuntu-latest
    # The password is the local compose default, not a hosted credential.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
      APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
      APP_DB_PASSWORD: groundwork
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Migrate again
        run: pnpm db:migrate

      - name: Row level security
        run: pnpm test:rls

  imagery:
    name: imagery
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tile guard
        run: pnpm test:tiles

      - name: Start Postgres, MinIO, and TiTiler
        run: |
          set -eu
          if ! docker compose up -d --build --wait postgres minio minio-init titiler; then
            docker compose ps -a || true
            docker compose logs --no-color --timestamps || true
            exit 1
          fi

      - name: Migrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
          APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
          APP_DB_PASSWORD: groundwork

      - name: Imagery and TiTiler
        run: pnpm test:imagery
        env:
          DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
          APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
          APP_DB_PASSWORD: groundwork
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: groundwork
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          TITILER_URL: http://127.0.0.1:8080
          TILE_SIGNING_SECRET: local-tile-signing-secret
