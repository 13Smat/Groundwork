name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Python venv module
        run: sudo apt-get update && sudo apt-get install -y python3-venv

      - name: Check
        run: pnpm check

      - name: OpenAPI breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:apps/api/openapi.json"; then
            git show "origin/${{ github.base_ref }}:apps/api/openapi.json" > /tmp/openapi-base.json
          else
            printf '%s\n' '{"openapi":"3.1.0","info":{"title":"Groundwork API","version":"0.0.0"},"paths":{}}' > /tmp/openapi-base.json
          fi
          OPENAPI_BASE=/tmp/openapi-base.json pnpm --filter @groundwork/api openapi:breaking

  db:
    name: db
    runs-on: ubuntu-latest
    # The password is the local compose default, not a hosted credential.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
      APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
      APP_DB_PASSWORD: groundwork
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Migrate again
        run: pnpm db:migrate

      - name: Row level security
        run: pnpm test:rls

      - name: Auth and workspaces
        run: pnpm test:auth

      - name: CRM and jobs
        run: pnpm test:crm

      - name: Takeoff and measurements
        run: pnpm test:takeoff

      - name: Estimating
        run: pnpm test:estimating

      - name: Proposals
        run: pnpm test:proposals

      - name: Demo seed
        run: pnpm test:seed

      - name: OpenAPI tenant and problem contracts
        run: pnpm test:contracts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      CI: "true"
      DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
      APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
      APP_DB_PASSWORD: groundwork
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-latest is 26.04. Playwright 1.57 has no dependency list for it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start MinIO
        run: |
          set -eu
          # --wait treats the one-shot init as a failure after it exits 0.
          # The imagery job hides that because titiler is still starting.
          if ! docker compose up -d --build --wait minio; then
            docker compose ps -a || true
            docker compose logs --no-color --timestamps minio || true
            exit 1
          fi
          if ! docker compose run --rm --build --no-deps minio-init; then
            docker compose logs --no-color --timestamps minio || true
            exit 1
          fi

      - name: Python venvs for mock CV and chip crop
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y python3-venv
          sh scripts/ensure-cv-venv.sh
          sh scripts/ensure-imagery-venv.sh

      - name: Playwright
        run: pnpm test:e2e

  imagery:
    name: imagery
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tile guard
        run: pnpm test:tiles

      - name: Start Postgres, MinIO, and TiTiler
        run: |
          set -eu
          if ! docker compose up -d --build --wait postgres minio minio-init titiler; then
            docker compose ps -a || true
            docker compose logs --no-color --timestamps || true
            exit 1
          fi

      - name: Migrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
          APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
          APP_DB_PASSWORD: groundwork

      - name: Imagery ingest unit tests
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          pnpm test:imagery-ingest

      - name: CV contract, chip crop, and assist
        run: |
          set -eu
          pnpm test:cv
          PYTHONPATH=services/cv .venv-imagery/bin/python -m unittest services/cv/tests/test_crop.py -v
          pnpm test:assist
        env:
          DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
          APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
          APP_DB_PASSWORD: groundwork
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: groundwork
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

      - name: Imagery and TiTiler
        run: |
          set -eu
          if ! pnpm test:imagery; then
            docker compose logs --no-color --timestamps --tail 200 titiler || true
            exit 1
          fi
        env:
          DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:5432/groundwork
          APP_DATABASE_URL: postgres://groundwork_app:groundwork@127.0.0.1:5432/groundwork
          APP_DB_PASSWORD: groundwork
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: groundwork
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          TITILER_URL: http://127.0.0.1:8080
          TILE_SIGNING_SECRET: local-tile-signing-secret
